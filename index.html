<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>2027 Internship Tracker 🎀</title>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --pink-bg: #fff0f6;
      --pink-grid: rgba(255, 182, 213, 0.25);
      --pink-card: rgba(255, 255, 255, 0.96);
      --pink-border: #ffd1e3;
      --pink-primary: #ff5c97;
      --pink-primary-dark: #e63e7b;
      --pink-soft: #ffe4ef;
      --text-main: #4a2c3a;
      --text-muted: #9e7386;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Quicksand', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      color: var(--text-main);
      padding: 20px 16px 40px;
      /* Cute Pastel Pink Gingham Pattern */
      background-color: var(--pink-bg);
      background-image:
        linear-gradient(90deg, var(--pink-grid) 50%, transparent 50%),
        linear-gradient(var(--pink-grid) 50%, transparent 50%);
      background-size: 28px 28px;
    }

    .container {
      max-width: 460px;
      margin: 0 auto;
    }

    /* Header */
    .header {
      text-align: center;
      margin-bottom: 18px;
    }

    .header h1 {
      font-size: 1.65rem;
      font-weight: 700;
      color: #d6336c;
      letter-spacing: -0.3px;
      text-shadow: 0 2px 6px rgba(255, 133, 179, 0.25);
    }

    .header p {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 4px;
      font-weight: 600;
    }

    /* Backup & Restore Buttons */
    .top-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 18px;
    }

    .btn-outline {
      background: var(--pink-card);
      border: 1.5px solid var(--pink-border);
      border-radius: 14px;
      padding: 11px 14px;
      font-size: 0.92rem;
      font-weight: 700;
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(255, 133, 179, 0.12);
      transition: transform 0.15s ease, background 0.15s ease;
    }

    .btn-outline:active {
      transform: scale(0.97);
      background: var(--pink-soft);
    }

    /* Stats Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }

    .stat-card {
      background: var(--pink-card);
      border: 1.5px solid var(--pink-border);
      border-radius: 18px;
      padding: 16px 12px;
      text-align: center;
      box-shadow: 0 6px 16px rgba(255, 133, 179, 0.14);
      position: relative;
      overflow: hidden;
    }

    .stat-card::before {
      content: "✿";
      position: absolute;
      top: 6px;
      right: 10px;
      font-size: 0.75rem;
      color: #ffc2d9;
    }

    .stat-label {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.8px;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .stat-value {
      font-size: 1.85rem;
      font-weight: 700;
      line-height: 1.1;
    }

    .val-applied { color: #ff5c97; }
    .val-interview { color: #9b5de5; }
    .val-offer { color: #20b486; }
    .val-rejected { color: #ff5964; }

    /* Form Card */
    .card {
      background: var(--pink-card);
      border: 1.5px solid var(--pink-border);
      border-radius: 22px;
      padding: 20px 18px;
      margin-bottom: 20px;
      box-shadow: 0 8px 22px rgba(255, 133, 179, 0.16);
    }

    .card-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: #d6336c;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-size: 0.86rem;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .form-control {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid #ffd6e6;
      border-radius: 13px;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-main);
      background: #fff9fb;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .form-control:focus {
      border-color: var(--pink-primary);
      box-shadow: 0 0 0 3px rgba(255, 92, 151, 0.16);
      background: #ffffff;
    }

    .form-control::placeholder {
      color: #cfa7b8;
      font-weight: 500;
    }

    .btn-primary {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, #ff7aa8, #ff4d8d);
      color: #ffffff;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 6px;
      box-shadow: 0 6px 16px rgba(255, 77, 141, 0.32);
      transition: transform 0.15s ease, filter 0.15s ease;
    }

    .btn-primary:active {
      transform: scale(0.98);
      filter: brightness(0.95);
    }

    /* Application List Cards */
    .list-header {
      font-size: 0.95rem;
      font-weight: 700;
      color: #c2255c;
      margin: 0 4px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .app-card {
      background: var(--pink-card);
      border: 1.5px solid var(--pink-border);
      border-radius: 20px;
      padding: 16px 18px;
      margin-bottom: 14px;
      box-shadow: 0 6px 18px rgba(255, 133, 179, 0.14);
    }

    .app-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 9px 0;
      border-bottom: 1px dashed #ffe0ec;
    }

    .app-row:first-child {
      padding-top: 2px;
      align-items: flex-start;
    }

    .app-row:last-child {
      border-bottom: none;
      padding-bottom: 2px;
    }

    .row-label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .company-info {
      text-align: right;
    }

    .company-name {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .company-role {
      font-size: 0.84rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .date-text {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--text-main);
    }

    /* Interactive Status Pill */
    .status-select {
      appearance: none;
      -webkit-appearance: none;
      border: none;
      border-radius: 999px;
      padding: 6px 14px;
      font-size: 0.84rem;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      outline: none;
    }

    .status-Applied {
      background: #ffe0ec;
      color: #c2255c;
    }

    .status-Interview {
      background: #efe3ff;
      color: #7048e8;
    }

    .status-Offer {
      background: #d8f8ec;
      color: #12805c;
    }

    .status-Rejected {
      background: #ffe3e6;
      color: #d9304f;
    }

    .btn-delete {
      background: #fff0f3;
      border: 1px solid #ffd1dc;
      color: #e63956;
      border-radius: 10px;
      padding: 6px 10px;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn-delete:active {
      background: #ffd6e0;
    }

    .empty-state {
      text-align: center;
      padding: 28px 16px;
      background: rgba(255, 255, 255, 0.8);
      border: 1.5px dashed #ffb8d2;
      border-radius: 20px;
      color: var(--text-muted);
      font-weight: 600;
      font-size: 0.92rem;
    }

    /* Toast notification */
    .toast {
      position: fixed;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #d6336c;
      color: #fff;
      padding: 10px 20px;
      border-radius: 999px;
      font-size: 0.88rem;
      font-weight: 700;
      box-shadow: 0 6px 18px rgba(214, 51, 108, 0.35);
      transition: transform 0.25s ease;
      z-index: 999;
      white-space: nowrap;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Title -->
    <div class="header">
      <h1>🎀 2027 Internship Tracker 🎀</h1>
      <p>✨ Stay organized &amp; manifest that offer ✨</p>
    </div>

    <!-- Backup & Restore -->
    <div class="top-actions">
      <button class="btn-outline" onclick="backupData()">📥 Backup</button>
      <button class="btn-outline" onclick="document.getElementById('restoreFile').click()">📋 Restore</button>
      <input type="file" id="restoreFile" accept=".json" style="display:none" onchange="restoreData(event)">
    </div>

    <!-- Summary Cards -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">Applied</div>
        <div class="stat-value val-applied" id="countApplied">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Interviews</div>
        <div class="stat-value val-interview" id="countInterview">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Offers</div>
        <div class="stat-value val-offer" id="countOffer">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Rejected</div>
        <div class="stat-value val-rejected" id="countRejected">0</div>
      </div>
    </div>

    <!-- Log New Application Form -->
    <div class="card">
      <div class="card-title">🌸 Log New Application</div>
      <form id="appForm">
        <div class="form-group">
          <label for="company">Company Name</label>
          <input type="text" id="company" class="form-control" placeholder="e.g. Western Digital" required>
        </div>
        <div class="form-group">
          <label for="role">Position / Role</label>
          <input type="text" id="role" class="form-control" placeholder="e.g. Embedded Systems Intern" required>
        </div>
        <div class="form-group">
          <label for="dateApplied">Date Applied</label>
          <input type="date" id="dateApplied" class="form-control" required>
        </div>
        <div class="form-group">
          <label for="status">Current Status</label>
          <select id="status" class="form-control">
            <option value="Applied">Applied</option>
            <option value="Interview">Interview</option>
            <option value="Offer">Offer</option>
            <option value="Rejected">Rejected</option>
          </select>
        </div>
        <button type="submit" class="btn-primary">💖 Add Application</button>
      </form>
    </div>

    <!-- Saved Applications List -->
    <div class="list-header">
      <span>🌷 My Applications</span>
      <span id="totalCount" style="font-size: 0.82rem; color: var(--text-muted);">0 total</span>
    </div>
    <div id="appList"></div>
  </div>

  <div class="toast" id="toast">Saved!</div>

  <script>
    const STORAGE_KEY = 'pink_internship_tracker_2027';
    let applications = [];

    // Set today's date as default
    document.getElementById('dateApplied').valueAsDate = new Date();

    // Load saved data
    function loadData() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) applications = JSON.parse(saved);
      } catch (e) {
        applications = [];
      }
      render();
    }

    function saveData() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(applications));
      } catch (e) {
        showToast('Could not save locally');
      }
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2200);
    }

    // Add new application
    document.getElementById('appForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const company = document.getElementById('company').value.trim();
      const role = document.getElementById('role').value.trim();
      const dateApplied = document.getElementById('dateApplied').value;
      const status = document.getElementById('status').value;

      if (!company || !role) return;

      applications.unshift({
        id: Date.now(),
        company,
        role,
        dateApplied,
        status
      });

      saveData();
      render();

      document.getElementById('company').value = '';
      document.getElementById('role').value = '';
      document.getElementById('status').value = 'Applied';
      document.getElementById('dateApplied').valueAsDate = new Date();
      showToast('💖 Application added!');
    });

    // Update status directly from card
    function updateStatus(id, newStatus) {
      const item = applications.find(a => a.id === id);
      if (item) {
        item.status = newStatus;
        saveData();
        render();
        showToast('✨ Status updated to ' + newStatus);
      }
    }

    // Delete application
    function deleteApp(id) {
      if (confirm('Remove this application?')) {
        applications = applications.filter(a => a.id !== id);
        saveData();
        render();
        showToast('🗑️ Application removed');
      }
    }

    // Backup to JSON file
    function backupData() {
      const dataStr = JSON.stringify(applications, null, 2);
      const blob = new Blob([dataStr], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'internship-tracker-2027-backup.json';
      a.click();
      URL.revokeObjectURL(url);
      showToast('📥 Backup downloaded!');
    }

    // Restore from JSON file
    function restoreData(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const imported = JSON.parse(e.target.result);
          if (Array.isArray(imported)) {
            applications = imported;
            saveData();
            render();
            showToast('🎀 Backup restored!');
          } else {
            alert('Invalid backup file.');
          }
        } catch (err) {
          alert('Could not read backup file.');
        }
      };
      reader.readAsText(file);
      event.target.value = '';
    }

    // Render stats and list
    function render() {
      const counts = { Applied: 0, Interview: 0, Offer: 0, Rejected: 0 };
      applications.forEach(a => {
        if (counts[a.status] !== undefined) counts[a.status]++;
      });

      document.getElementById('countApplied').textContent = counts.Applied;
      document.getElementById('countInterview').textContent = counts.Interview;
      document.getElementById('countOffer').textContent = counts.Offer;
      document.getElementById('countRejected').textContent = counts.Rejected;
      document.getElementById('totalCount').textContent = applications.length + ' total';

      const listEl = document.getElementById('appList');
      if (applications.length === 0) {
        listEl.innerHTML = '<div class="empty-state">🌸 No applications yet! Add your first one above 💖</div>';
        return;
      }

      listEl.innerHTML = applications.map(app => `
        <div class="app-card">
          <div class="app-row">
            <span class="row-label">Company Details</span>
            <div class="company-info">
              <div class="company-name">${escapeHtml(app.company)}</div>
              <div class="company-role">${escapeHtml(app.role)}</div>
            </div>
          </div>
          <div class="app-row">
            <span class="row-label">Date Applied</span>
            <span class="date-text">${escapeHtml(app.dateApplied)}</span>
          </div>
          <div class="app-row">
            <span class="row-label">Pipeline Status</span>
            <select class="status-select status-${app.status}" onchange="updateStatus(${app.id}, this.value)">
              <option value="Applied" ${app.status === 'Applied' ? 'selected' : ''}>Applied</option>
              <option value="Interview" ${app.status === 'Interview' ? 'selected' : ''}>Interview</option>
              <option value="Offer" ${app.status === 'Offer' ? 'selected' : ''}>Offer</option>
              <option value="Rejected" ${app.status === 'Rejected' ? 'selected' : ''}>Rejected</option>
            </select>
          </div>
          <div class="app-row">
            <span class="row-label">Remove</span>
            <button class="btn-delete" onclick="deleteApp(${app.id})" title="Delete">🗑️</button>
          </div>
        </div>
      `).join('');
    }

    loadData();
  </script>
</body>
</html>
